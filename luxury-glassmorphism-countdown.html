<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c101b"><title>A little something is coming</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--cream:#f7efe5;--gold:#d8b991}*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:#0b101b;color:var(--cream);font-family:'DM Sans',Arial,sans-serif;padding:28px 16px;isolation:isolate}body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 12% 8%,#98714455,transparent 40%),radial-gradient(ellipse at 90% 85%,#70517c70,transparent 48%),radial-gradient(ellipse at 70% 18%,#4a3a5d88,transparent 42%),linear-gradient(145deg,#080b14,#171325 52%,#0b101d)}.orb{position:fixed;border-radius:50%;filter:blur(5px);pointer-events:none;z-index:-2;animation:drift 16s ease-in-out infinite alternate}.orb.one{width:min(55vw,440px);aspect-ratio:1;left:-14%;top:-18%;background:radial-gradient(circle at 30% 30%,#e5c7ae88,#b48f8b20 65%,transparent 75%)}.orb.two{width:min(65vw,560px);aspect-ratio:1;right:-22%;bottom:-30%;background:radial-gradient(circle,#9881b988,#56769d1c 65%,transparent 76%);animation-delay:-8s}.grain{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E")}.panel{z-index:2;width:min(92%,570px);position:relative;overflow:hidden;border:1px solid #ffffff43;border-radius:30px;padding:clamp(30px,6vw,54px) clamp(18px,5vw,48px);text-align:center;background:linear-gradient(140deg,#ffffff22,#ffffff0c 48%,#ffffff12);box-shadow:0 30px 100px #0008,inset 0 1px #ffffff55;backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);animation:arrive 1.2s cubic-bezier(.2,.7,.2,1) both}.panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,#ffffff25,transparent 32%)}.star{font-size:30px;color:#e9cda8;font-weight:300;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#e0c5a9;margin-bottom:18px}h1{font-family:Italiana,Georgia,serif;font-weight:400;font-size:clamp(35px,7.7vw,59px);line-height:1.12;letter-spacing:.005em;margin:0 0 20px;text-wrap:balance}.subtitle{font-size:clamp(13px,2.5vw,15px);font-weight:300;line-height:1.9;color:#eee7e0c9;margin:0}.divider{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px auto 20px}.date{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#ead1b2;margin-bottom:21px}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;gap:0;margin:auto;max-width:510px}.unit{min-width:0;position:relative;padding:3px 3px 8px}.unit+.unit:before{content:"";position:absolute;left:0;top:12px;height:43px;width:1px;background:linear-gradient(transparent,#ffffff44,transparent)}.num{font-family:Italiana,Georgia,serif;font-size:clamp(32px,8vw,56px);line-height:1.12;font-variant-numeric:tabular-nums;display:block;transition:opacity .24s ease,transform .24s ease}.num.tick{opacity:.58;transform:translateY(-3px)}.label{display:block;margin-top:10px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e7d6c6a8}.note{margin:25px 0 0;color:#e8dfd2b5;font-size:12px;letter-spacing:.04em;line-height:1.7}@keyframes drift{to{transform:translate(35px,-30px) scale(1.09)}}@keyframes arrive{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}@media(max-width:400px){.panel{border-radius:23px;padding:32px 15px}.eyebrow{letter-spacing:.27em}.label{font-size:8px;letter-spacing:.11em}.unit+.unit:before{top:9px;height:33px}.note{margin-top:28px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Cinematic golden spheres, with realistic metallic highlights */
.gold-scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;perspective:900px}
.gold-ball{position:absolute;display:block;border-radius:50%;aspect-ratio:1;background:radial-gradient(circle at 29% 23%,#fff8d9 0%,#ffe6a9 7%,#d5a65c 21%,#8c5c30 48%,#e5b96c 66%,#3e281f 88%,#17131c 100%);box-shadow:inset -10px -16px 24px #1b14209c,inset 5px 5px 13px #fff5cf88,0 18px 50px #0009,0 0 55px #d2a65c26;opacity:.9;animation:floatGold 17s ease-in-out infinite alternate;will-change:transform}
.gold-ball:after{content:"";position:absolute;left:18%;top:13%;width:31%;height:17%;border-radius:50%;background:#fff9dcbb;filter:blur(9px);transform:rotate(-32deg)}
.gold-ball.b1{width:clamp(110px,25vw,310px);left:-9%;top:9%;animation-duration:21s}
.gold-ball.b2{width:clamp(75px,16vw,190px);right:-5%;top:16%;animation-delay:-7s;animation-duration:18s}
.gold-ball.b3{width:clamp(100px,21vw,250px);right:-9%;bottom:5%;animation-delay:-11s;animation-duration:24s;opacity:.72}
.gold-ball.b4{width:clamp(28px,5vw,64px);left:13%;bottom:14%;animation-delay:-4s;opacity:.8}
.gold-ball.b5{width:clamp(20px,3.5vw,42px);right:20%;top:6%;animation-delay:-14s;opacity:.7}
.gold-haze{position:absolute;inset:0;background:radial-gradient(circle at 17% 36%,#e3ad5521,transparent 30%),radial-gradient(circle at 85% 64%,#d6a85c1c,transparent 34%)}
@keyframes floatGold{from{transform:translate3d(0,0,0) rotate(-8deg)}to{transform:translate3d(18px,-35px,35px) rotate(9deg)}}
@media(max-width:600px){.gold-ball.b1{left:-18%;top:7%}.gold-ball.b2{right:-11%;top:23%}.gold-ball.b3{right:-16%;bottom:9%}.gold-ball.b4{left:5%;bottom:21%}.panel{box-shadow:0 35px 110px #000b,inset 0 1px #fff6}}
</style><style>
/* Reduced vertical height, preserving the cinematic background and glass treatment */
.panel{padding-top:24px;padding-bottom:24px;max-width:510px}
.star{margin-bottom:8px;font-size:24px}
.eyebrow{margin-bottom:10px}
h1{font-size:clamp(32px,7vw,51px);line-height:1.08;margin-bottom:12px}
.subtitle{line-height:1.55}
.divider{margin:15px auto 13px}
.date{margin-bottom:12px}
.unit{padding-bottom:3px}
.num{font-size:clamp(30px,7.5vw,49px)}
.label{margin-top:5px}
.note{margin-top:14px;line-height:1.45}
@media(max-width:400px){.panel{padding:22px 16px}.note{margin-top:14px}}
</style></head><body><div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="gold-scene" aria-hidden="true"><div class="gold-haze"></div><i class="gold-ball b1"></i><i class="gold-ball b2"></i><i class="gold-ball b3"></i><i class="gold-ball b4"></i><i class="gold-ball b5"></i></div><main class="panel"><div class="star" aria-hidden="true">✧</div><div class="eyebrow">A little pause</div><h1>Something thoughtful<br>is on its way.</h1><p class="subtitle">A little time, a little care.<br>See you here soon.</p><div class="divider" aria-hidden="true"></div><div class="date">24 February 2027</div><div class="countdown" role="timer" aria-label="Countdown to 24 February 2027, India time"><div class="unit"><span class="num" id="days">--</span><span class="label">Days</span></div><div class="unit"><span class="num" id="hours">--</span><span class="label">Hours</span></div><div class="unit"><span class="num" id="minutes">--</span><span class="label">Minutes</span></div><div class="unit"><span class="num" id="seconds">--</span><span class="label">Seconds</span></div></div><p class="note" id="note">Until then, wishing you lovely days.</p><noscript><p class="note">Coming on 24 February 2027.</p></noscript></main><script>
const target=Date.parse('2027-02-24T00:00:00+05:30');let ticker;const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;function update(){const remaining=Math.max(0,Math.ceil((target-Date.now())/1000));const vals={days:Math.floor(remaining/86400),hours:Math.floor(remaining/3600)%24,minutes:Math.floor(remaining/60)%60,seconds:remaining%60};for(const [id,val] of Object.entries(vals)){const el=document.getElementById(id),next=String(val).padStart(2,'0');if(el.textContent!==next){if(!reduceMotion&&el.textContent!=='--'){el.classList.add('tick');setTimeout(()=>el.classList.remove('tick'),230)}el.textContent=next}}if(!remaining){document.getElementById('note').textContent='The day is here. Something lovely is coming soon.';clearInterval(ticker)}}update();if(Date.now()<target)ticker=setInterval(update,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
</script></body></html>
